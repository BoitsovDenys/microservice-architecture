# Server settings
server.port=${RESOURCE_SERVICE_PORT:8081}

# Song Service URL
song-service.url=${SONG_SERVICE_URL:http://localhost:8082}

# Database settings
spring.datasource.url=jdbc:postgresql://${RESOURCE_DB_HOST:localhost}:${RESOURCE_DB_PORT:5432}/${RESOURCE_DB_NAME:resource_service_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.username=${RESOURCE_DB_USERNAME:postgres}
spring.datasource.password=${RESOURCE_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true

# File upload settings
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Set the log level
logging.level.org.springframework=INFO
logging.level.com.epam.microservices=INFO
logging.level.org.hibernate.SQL=DEBUG
